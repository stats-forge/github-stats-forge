packages:
  - packages/*
  - apps/*

overrides:
  # Only to keep the deprecated node-domexception, and four other shims, out of the lockfile:
  # no code of either package runs here, the site importing webawesome's components and
  # never the @lit-labs/ssr behind them.
  node-fetch: npm:node-fetch-native@^1.6.7

allowBuilds:
  # astro's bundler; it fetches its platform binary in a postinstall
  esbuild: true
  lefthook: true

catalog:
  '@vitest/coverage-v8': 4.1.11
  jsdom: 30.0.1
  vitest: 4.1.11

# Deliberately stricter than pnpm's 1440 default (3 days vs 1)
minimumReleaseAge: 4320

# Reject a version with weaker publish trust evidence than an earlier one.
trustPolicy: no-downgrade

# Fail on unmet peers and on a Node version outside `engines`, instead of warning
strictPeerDependencies: true
engineStrict: true
