packages:
  - packages/*
  - apps/*

overrides:
  # Only to keep the deprecated node-domexception, and four other shims, out of the lockfile:
  # no code of either package runs here, the site importing webawesome's components and
  # never the @lit-labs/ssr behind them.
  node-fetch: npm:node-fetch-native@^1.6.7
  # It asks for ^16 on behalf of a `validate` nothing here calls; the generator reads only its SDL.
  '@octokit/graphql-schema>graphql': ^17.0.0

allowBuilds:
  # astro's bundler; it fetches its platform binary in a postinstall
  esbuild: true
  lefthook: true

catalog:
  '@vitest/coverage-v8': 5.1.0
  jsdom: 31.0.0
  oxfmt: 0.77.0
  vitest: 5.1.0

# Deliberately stricter than pnpm's 1440 default (3 days vs 1)
minimumReleaseAge: 4320

# The cooling-off period buys nothing against our own packages.
minimumReleaseAgeExclude:
  - '@marcalexiei/oxfmt-config'
  - '@marcalexiei/oxlint-config'
  - '@stats-forge/card-kit'

# Reject a version with weaker publish trust evidence than an earlier one.
trustPolicy: no-downgrade

# Fail on unmet peers and on a Node version outside `engines`, instead of warning
strictPeerDependencies: true
engineStrict: true

# Its types-only cap lags Node's; webawesome's server rendering, the one user, never runs here.
peerDependencyRules:
  allowedVersions:
    '@lit-labs/ssr>@types/node': '26'

# An update re-resolves only what it bumps, leaving older copies another range would share.
autoDedupe: true
# Without it, a non-frozen install cannot tell the lockfile was deduped, and resolves it again.
lockfile:
  includeResolutionSettings: true
