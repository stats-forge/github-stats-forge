# `packageManager` in package.json is held at pnpm 10 out of inertia, not need:
# bumping to 11 wants a lockfile regeneration and a CI run, so it is a change of its own.
packages:
  - packages/*

onlyBuiltDependencies:
  - "@swc/core"
  - esbuild
  - unrs-resolver

catalog:
  "@vitest/coverage-v8": 4.1.10
  jsdom: 29.1.1
  vitest: 4.1.10

# Deliberately stricter than pnpm 11's 1440 default (7 days vs 1)
minimumReleaseAge: 10080

# Reject a version with weaker publish trust evidence than an earlier one.
trustPolicy: no-downgrade

# Fail on unmet peers and on a Node version outside `engines`, instead of warning
strictPeerDependencies: true
engineStrict: true
