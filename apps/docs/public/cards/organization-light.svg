      <circle class="spark" cx="-20" cy="48" r="1.7" style="animation-delay: 1.1s" />
      <circle class="spark" cx="-6" cy="44" r="1.7" style="animation-delay: 2.2s" />
      <circle class="spark" cx="8" cy="50" r="1.7" style="animation-delay: 0.6s" />
      <circle class="spark" cx="20" cy="40" r="1.7" style="animation-delay: 1.7s" />
    </g>
