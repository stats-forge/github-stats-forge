          <text class="stat not_bold" y="12.5">Public repositories:</text>
          <text class="stat bold" x="344" text-anchor="end" y="12.5" data-testid="repos">7</text>
        </g>
      </g>
      <g transform="translate(0, 25)">
        <g class="stagger" style="animation-delay: 160ms" transform="translate(18, 0)">
          <text class="stat not_bold" y="12.5">Total stars:</text>
          <text class="stat bold" x="344" text-anchor="end" y="12.5" data-testid="stars">15.5k</text>
        </g>
      </g>
      <g transform="translate(0, 50)">
        <g class="stagger" style="animation-delay: 200ms" transform="translate(18, 0)">
          <text class="stat not_bold" y="12.5">Total forks:</text>
          <text class="stat bold" x="344" text-anchor="end" y="12.5" data-testid="forks">1.3k</text>
        </g>
      </g>
      <g transform="translate(0, 75)">
        <g class="stagger" style="animation-delay: 240ms" transform="translate(18, 0)">
          <text class="stat not_bold" y="12.5">Total watchers:</text>
          <text class="stat bold" x="344" text-anchor="end" y="12.5" data-testid="watchers">444</text>
        </g>
      </g>
      <g transform="translate(0, 100)">
        <g class="stagger" style="animation-delay: 280ms" transform="translate(18, 0)">
          <text class="stat not_bold" y="12.5">Open issues:</text>
          <text class="stat bold" x="344" text-anchor="end" y="12.5" data-testid="open_issues">91</text>
        </g>
      </g>
      <g transform="translate(0, 125)">
        <g class="stagger" style="animation-delay: 320ms" transform="translate(18, 0)">
          <text class="stat not_bold" y="12.5">Open PRs:</text>
          <text class="stat bold" x="344" text-anchor="end" y="12.5" data-testid="open_prs">38</text>
        </g>
      </g>
      <g transform="translate(0, 150)">
        <g class="stagger" style="animation-delay: 360ms" transform="translate(18, 0)">
          <text class="stat not_bold" y="12.5">Releases:</text>
          <text class="stat bold" x="344" text-anchor="end" y="12.5" data-testid="releases">146</text>
        </g>
      </g>
      <g transform="translate(0, 175)">
        <g class="stagger" style="animation-delay: 400ms" transform="translate(18, 0)">
          <text class="stat not_bold" y="12.5">Commits:</text>
          <text class="stat bold" x="344" text-anchor="end" y="12.5" data-testid="commits">8.6k</text>
        </g>
      </g>
      <g transform="translate(0, 200)">
        <g class="stagger" style="animation-delay: 440ms" transform="translate(18, 0)">
          <text class="stat not_bold" y="12.5">Top language:</text>
          <text class="stat bold" x="344" text-anchor="end" y="12.5" data-testid="top_language">TypeScript</text>
