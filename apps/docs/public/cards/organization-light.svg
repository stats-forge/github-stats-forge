<svg width="500" height="317" viewBox="0 0 500 317" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-id desc-id">
  <title id="title-id">The Forge Guild&#39;s GitHub Organization, Rank: A</title>
  <desc id="desc-id">Open-source tooling for smiths of every trade: build pipelines, test harnesses and the odd README card.. Public repositories: 7, Total stars: 15512, Total forks: 1307, Total watchers: 444, Open issues: 91, Open PRs: 38, Releases: 146, Commits: 8576, Top language: TypeScript</desc>
  <style>
    .header {
      font: 600 18px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif;
      fill: #e2470f;
      animation: fadeInAnimation 0.8s ease-in-out backwards;
    }
    /* The icon reads against the title rather than with it, so it keeps its own color. */
    .title-icon {
      fill: #e2470f;
      animation: fadeInAnimation 0.8s ease-in-out backwards;
    }
    .title-accent {
      transform-box: fill-box;
      transform-origin: left center;
      animation: trailAnimation 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) 0.2s backwards;
    }
    @supports(-moz-appearance: auto) {
      /* Selector detects Firefox */
      .header {
        font-size: 15.5px;
      }
    }
    .stat {
      font: 400 14px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif;
      fill: #2a1b14;
      font-variant-numeric: tabular-nums;
    }
    .description {
      font: 400 13px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif;
      fill: #2a1b14;
      opacity: 0.9;
    }
    .stagger {
      animation: fadeInAnimation 0.3s ease-in-out backwards;
    }
    .not_bold {
      font-weight: 400;
      opacity: 0.75;
    }
    .bold {
      font-weight: 600;
    }
    .icon {
      fill: #e2470f;
      opacity: 0.75;
      display: none;
    }
    .rank-text {
      font: 700 22px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif;
      fill: #e2470f;
      transform: translate(-5px, 5px);
      animation: scaleInAnimation 0.3s ease-in-out backwards;
    }
    .rank-percentile-header {
      font-size: 14px;
    }
    .rank-percentile-text {
      font-size: 16px;
    }
    .rank-circle-rim {
      stroke: #2a1b14;
      fill: none;
      stroke-width: 6;
      opacity: 0.12;
    }
    .rank-circle {
      stroke: url(#heat-ring);
      stroke-dasharray: 251.32741228718345;
      fill: none;
      stroke-width: 6;
      stroke-linecap: round;
      opacity: 1;
      transform-origin: -10px 8px;
      transform: rotate(-90deg);
      stroke-dashoffset: 46.39720037995175;
      animation: rankAnimation 0.8s backwards ease-in-out;
    }
    @keyframes rankAnimation {
      from {
        stroke-dashoffset: 251.32741228718345;
      }
      to {
        stroke-dashoffset: 46.39720037995175;
      }
    }
    /* A spark burns out at the top of its rise, so its resting frame is unlit. */
    .spark {
      fill: #dc7600;
      opacity: 0;
      animation: sparkAnimation 3.4s ease-out 3 backwards;
    }
    @keyframes sparkAnimation {
      0% {
        opacity: 0;
        transform: translateY(0);
      }
      15% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translateY(-56px);
      }
    }
    /* Animations */
    @keyframes scaleInAnimation {
      from {
        transform: translate(-5px, 5px) scale(0);
      }
      to {
        transform: translate(-5px, 5px) scale(1);
      }
    }
    @keyframes fadeInAnimation {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
    @keyframes trailAnimation {
      from {
        transform: scaleX(0);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0s !important;
        animation-delay: 0s !important;
      }
    }
  </style>
  <defs>
    <linearGradient id="heat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" class="heat-0" stop-color="#dc7600" />
      <stop offset="0.55" class="heat-1" stop-color="#e2470f" />
      <stop offset="1" class="heat-2" stop-color="#c8174f" />
    </linearGradient>
    <linearGradient id="heat-ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" class="heat-0" stop-color="#dc7600" />
      <stop offset="0.55" class="heat-1" stop-color="#e2470f" />
      <stop offset="1" class="heat-2" stop-color="#c8174f" />
    </linearGradient>
    <linearGradient id="heat-trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" class="heat-0" stop-color="#dc7600" />
      <stop offset="0.3" class="heat-1" stop-color="#e2470f" />
      <stop offset="0.7" class="heat-2" stop-color="#c8174f" stop-opacity="0.5" />
      <stop offset="1" class="heat-2" stop-color="#c8174f" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="heat-band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" class="band-0" stop-color="#dc7600" stop-opacity="0.05" />
      <stop offset="0.55" class="band-1" stop-color="#e2470f" stop-opacity="0.05" />
      <stop offset="1" class="band-2" stop-color="#c8174f" stop-opacity="0.035" />
    </linearGradient>
    <radialGradient id="heat-glow" cx="0.95" cy="1.05" r="0.8">
      <stop offset="0" class="glow-core" stop-color="#e2470f" stop-opacity="0.05" />
      <stop offset="0.45" class="glow-edge" stop-color="#c8174f" stop-opacity="0.017" />
      <stop offset="1" class="heat-2" stop-color="#c8174f" stop-opacity="0" />
    </radialGradient>
    <filter id="heat-bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5" />
      </feComponentTransfer>
    </filter>
  </defs>
  <rect data-testid="card-bg" class="card-bg" x="0.5" y="0.5" rx="14" height="99%" width="499" stroke="#e2470f4d" fill="#fffaf6" stroke-opacity="1" />
  <rect data-testid="card-glow" x="0.5" y="0.5" rx="14" height="99%" width="499" fill="url(#heat-glow)" />
  <path data-testid="title-band" d="M0.5 14.5a14 14 0 0 1 14 -14h471a14 14 0 0 1 14 14v26.5h-499z" fill="url(#heat-band)" />
  <g data-testid="card-title" transform="translate(18, 25)">
    <g>
      <svg class="title-icon" x="0" y="-13" viewBox="0 0 16 16" version="1.1" width="16" height="16">
        <path d="M1.75 16A1.75 1.75 0 0 1 0 14.25V1.75C0 .784.784 0 1.75 0h8.5C11.216 0 12 .784 12 1.75v12.5c0 .085-.006.168-.018.25h2.268a.25.25 0 0 0 .25-.25V8.285a.25.25 0 0 0-.111-.208l-1.055-.703a.749.749 0 1 1 .832-1.248l1.055.703c.487.325.779.871.779 1.456v5.965A1.75 1.75 0 0 1 14.25 16h-3.5a.766.766 0 0 1-.197-.026c-.099.017-.2.026-.303.026h-3a.75.75 0 0 1-.75-.75V14h-1v1.25a.75.75 0 0 1-.75.75Zm-.25-1.75c0 .138.112.25.25.25H4v-1.25a.75.75 0 0 1 .75-.75h2.5a.75.75 0 0 1 .75.75v1.25h2.25a.25.25 0 0 0 .25-.25V1.75a.25.25 0 0 0-.25-.25h-8.5a.25.25 0 0 0-.25.25ZM3.75 6h.5a.75.75 0 0 1 0 1.5h-.5a.75.75 0 0 1 0-1.5ZM3 3.75A.75.75 0 0 1 3.75 3h.5a.75.75 0 0 1 0 1.5h-.5A.75.75 0 0 1 3 3.75Zm4 3A.75.75 0 0 1 7.75 6h.5a.75.75 0 0 1 0 1.5h-.5A.75.75 0 0 1 7 6.75ZM7.75 3h.5a.75.75 0 0 1 0 1.5h-.5a.75.75 0 0 1 0-1.5ZM3 9.75A.75.75 0 0 1 3.75 9h.5a.75.75 0 0 1 0 1.5h-.5A.75.75 0 0 1 3 9.75ZM7.75 9h.5a.75.75 0 0 1 0 1.5h-.5a.75.75 0 0 1 0-1.5Z" />
      </svg>
    </g>
    <g transform="translate(25, 0)">
      <text x="0" y="0" class="header" data-testid="header">The Forge Guild&#39;s GitHub Organization</text>
    </g>
    <rect data-testid="title-accent" class="title-accent" x="0" y="8" width="386.7" height="2" rx="1" fill="url(#heat-trail)" />
  </g>
  <g data-testid="main-card-body" transform="translate(0, 50)">
    <text class="description" data-testid="description" x="18" y="-5"><tspan dy="1.2em" x="18">Open-source tooling for smiths of every trade: build pipelines, test harnesses</tspan><tspan dy="1.2em" x="18">and the odd README card.</tspan></text>
    <g data-testid="rank-circle" transform="translate(441, 139.5)">
      <circle class="rank-circle-rim" cx="-10" cy="8" r="40" />
      <circle class="rank-circle" cx="-10" cy="8" r="40" data-testid="rank-ring-glow" filter="url(#heat-bloom)" />
      <circle class="rank-circle" cx="-10" cy="8" r="40" data-testid="rank-ring" />
      <g class="rank-text">
        <text x="-5" alignment-baseline="central" dominant-baseline="central" text-anchor="middle" y="3" data-testid="level-rank-icon">A</text>
      </g>
