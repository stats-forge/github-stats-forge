      <text data-testid="summary" class="calendar-summary" x="54" y="17">pull requests merged &#183; 10 a week</text>
    </g>
    <rect data-testid="week" class="week week-2" x="18" y="36" width="49.78" height="28" rx="2" fill="#ff7a1a" fill-opacity="0.6" style="animation-delay: 0ms" />
    <text data-testid="week-count" class="week week-count week-count-2" x="42.89" y="54" text-anchor="middle" fill="#f7ede6" style="animation-delay: 0ms">6</text>
    <rect data-testid="week" class="week week-2" x="69.78" y="36" width="49.78" height="28" rx="2" fill="#ff7a1a" fill-opacity="0.6" style="animation-delay: 10ms" />
    <text data-testid="week-count" class="week week-count week-count-2" x="94.67" y="54" text-anchor="middle" fill="#f7ede6" style="animation-delay: 10ms">9</text>
