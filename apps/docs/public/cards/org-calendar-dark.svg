    <text data-testid="week-count" class="week week-count week-count-1" x="146.44" y="54" text-anchor="middle" fill="#f7ede6" style="animation-delay: 20ms">4</text>
    <rect data-testid="week" class="week week-0" x="173.33" y="36" width="49.78" height="28" rx="2" fill="#ffffff33" fill-opacity="1" style="animation-delay: 30ms" />
    <text data-testid="week-count" class="week week-count week-count-0" x="198.22" y="54" text-anchor="middle" fill="#f7ede6" style="animation-delay: 30ms">0</text>
    <rect data-testid="week" class="week week-1" x="225.11" y="36" width="49.78" height="28" rx="2" fill="#ffd166" fill-opacity="0.4" style="animation-delay: 40ms" />
    <text data-testid="week-count" class="week week-count week-count-1" x="250" y="54" text-anchor="middle" fill="#f7ede6" style="animation-delay: 40ms">3</text>
    <rect data-testid="week" class="week week-2" x="276.89" y="36" width="49.78" height="28" rx="2" fill="#ff7a1a" fill-opacity="0.6" style="animation-delay: 50ms" />
    <text data-testid="week-count" class="week week-count week-count-2" x="301.78" y="54" text-anchor="middle" fill="#f7ede6" style="animation-delay: 50ms">11</text>
    <rect data-testid="week" class="week week-3" x="328.67" y="36" width="49.78" height="28" rx="2" fill="#ff7a1a" fill-opacity="0.8" style="animation-delay: 60ms" />
    <text data-testid="week-count" class="week week-count week-count-3" x="353.56" y="54" text-anchor="middle" fill="#16100d" style="animation-delay: 60ms">15</text>
    <rect data-testid="week" class="week week-4" x="380.44" y="36" width="49.78" height="28" rx="2" fill="#ff2e63" fill-opacity="1" style="animation-delay: 70ms" />
    <text data-testid="week-count" class="week week-count week-count-4" x="405.33" y="54" text-anchor="middle" fill="#16100d" style="animation-delay: 70ms">19</text>
    <rect data-testid="week" class="week week-4" x="432.22" y="36" width="49.78" height="28" rx="2" fill="#ff2e63" fill-opacity="1" style="animation-delay: 80ms" />
    <text data-testid="week-count" class="week week-count week-count-4" x="457.11" y="54" text-anchor="middle" fill="#16100d" style="animation-delay: 80ms">22</text>
    <text data-testid="from" class="calendar-foot" x="18" y="81">2026-09-02</text>
    <text data-testid="to" class="calendar-foot" x="482" y="81" text-anchor="end">2026-11-03</text>
    <g data-testid="legend">
      <text class="calendar-foot" x="193" y="81">Less</text>
      <rect class="week-0" x="218.27666621208192" y="72" width="10" height="10" rx="2" fill="#ffffff33" fill-opacity="1" />
      <rect class="week-1" x="230.27666621208192" y="72" width="10" height="10" rx="2" fill="#ffd166" fill-opacity="0.4" />
      <rect class="week-2" x="242.27666621208192" y="72" width="10" height="10" rx="2" fill="#ff7a1a" fill-opacity="0.6" />
      <rect class="week-3" x="254.27666621208192" y="72" width="10" height="10" rx="2" fill="#ff7a1a" fill-opacity="0.8" />
      <rect class="week-4" x="266.2766662120819" y="72" width="10" height="10" rx="2" fill="#ff2e63" fill-opacity="1" />
