<svg width="500" height="183" viewBox="0 0 500 183" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-id desc-id">
  <title id="title-id">WakaTime Stats (last 7 days)</title>
  <desc id="desc-id">37 hrs 19 mins, 5 hrs 19 mins a day. TypeScript: 14 hrs 22 mins, Rust: 9 hrs 48 mins, Go: 5 hrs 31 mins, Python: 3 hrs 12 mins, Markdown: 1 hrs 47 mins, YAML: 1 hrs 5 mins</desc>
  <style>
    .header {
      font: 600 18px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif;
      animation: fadeInAnimation 0.8s ease-in-out backwards;
    }
    tspan {
      dominant-baseline: inherit;
    }
    .heat-step-0 {
      fill: #dc7600;
    }
    .heat-step-1 {
      fill: #dd7002;
    }
    .heat-step-2 {
      fill: #dd6b04;
    }
    .heat-step-3 {
      fill: #de6505;
    }
    .heat-step-4 {
      fill: #df5f07;
    }
    .heat-step-5 {
      fill: #e05a09;
    }
    .heat-step-6 {
      fill: #e0540b;
    }
    .heat-step-7 {
      fill: #e14e0d;
    }
    .heat-step-8 {
      fill: #e2480f;
    }
    .heat-step-9 {
      fill: #df4216;
    }
    .heat-step-10 {
      fill: #db3b20;
    }
    .heat-step-11 {
      fill: #d73329;
    }
    .heat-step-12 {
      fill: #d42c33;
    }
    .heat-step-13 {
      fill: #d0253c;
    }
    .heat-step-14 {
      fill: #cc1e46;
    }
    .heat-step-15 {
      fill: #c8174f;
    }
    /* The icon reads against the title rather than with it, so it keeps its own color. */
    .title-icon {
      fill: #e2470f;
      animation: fadeInAnimation 0.8s ease-in-out backwards;
    }
    .title-accent {
      transform-box: fill-box;
      transform-origin: left center;
      animation: trailAnimation 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) 0.2s backwards;
    }
    @supports(-moz-appearance: auto) {
      /* Selector detects Firefox */
      .header {
        font-size: 15.5px;
      }
    }
    .stat {
      font: 400 14px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif;
      fill: #2a1b14;
    }
    @supports(-moz-appearance: auto) {
      /* Selector detects Firefox */
      .stat {
        font-size: 12px;
      }
    }
    .stagger {
      animation: fadeInAnimation 0.3s ease-in-out backwards;
    }
    .not_bold {
      font-weight: 400;
    }
    .bold {
      font-weight: 600;
    }
    @keyframes slideInAnimation {
      from {
        width: 0;
      }
      to {
        width: calc(100%-100px);
      }
    }
    @keyframes growWidthAnimation {
      from {
        width: 0;
      }
      to {
        width: 100%;
      }
    }
    .lang-name {
      font: 400 11px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif;
      fill: #2a1b14;
    }
    #rect-mask rect {
      animation: slideInAnimation 1s ease-in-out backwards;
    }
    .lang-progress {
      animation: growWidthAnimation 0.6s ease-in-out backwards;
      fill: url(#heat);
    }
    .progress-background {
      fill: #ddd;
    }
    .headline-total {
      font: 600 22px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif;
    }
    .headline-average {
      font: 400 12px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif;
      fill: #2a1b14;
      opacity: 0.75;
    }
    /* Animations */
    @keyframes scaleInAnimation {
      from {
        transform: translate(-5px, 5px) scale(0);
      }
      to {
        transform: translate(-5px, 5px) scale(1);
      }
    }
    @keyframes fadeInAnimation {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
    @keyframes trailAnimation {
      from {
        transform: scaleX(0);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0s !important;
        animation-delay: 0s !important;
      }
    }
  </style>
  <defs>
    <linearGradient id="heat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" class="heat-0" stop-color="#dc7600" />
      <stop offset="0.55" class="heat-1" stop-color="#e2470f" />
      <stop offset="1" class="heat-2" stop-color="#c8174f" />
    </linearGradient>
    <linearGradient id="heat-trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" class="heat-0" stop-color="#dc7600" />
      <stop offset="0.3" class="heat-1" stop-color="#e2470f" />
      <stop offset="0.7" class="heat-2" stop-color="#c8174f" stop-opacity="0.5" />
      <stop offset="1" class="heat-2" stop-color="#c8174f" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="heat-band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" class="band-0" stop-color="#dc7600" stop-opacity="0.1" />
      <stop offset="0.55" class="band-1" stop-color="#e2470f" stop-opacity="0.1" />
      <stop offset="1" class="band-2" stop-color="#c8174f" stop-opacity="0.07" />
    </linearGradient>
    <radialGradient id="heat-glow" cx="0.95" cy="1.05" r="0.8">
      <stop offset="0" class="glow-core" stop-color="#e2470f" stop-opacity="0.17" />
      <stop offset="0.45" class="glow-edge" stop-color="#c8174f" stop-opacity="0.06" />
      <stop offset="1" class="heat-2" stop-color="#c8174f" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect data-testid="card-bg" class="card-bg" x="0.5" y="0.5" rx="14" height="99%" width="499" stroke="#e2470f4d" fill="#fffaf6" stroke-opacity="1" />
  <rect data-testid="card-glow" x="0.5" y="0.5" rx="14" height="99%" width="499" fill="url(#heat-glow)" />
  <path data-testid="title-band" d="M0.5 14.5a14 14 0 0 1 14 -14h471a14 14 0 0 1 14 14v26.5h-499z" fill="url(#heat-band)" />
  <g data-testid="card-title" transform="translate(18, 25)">
    <g>
      <svg class="title-icon" x="0" y="-13" viewBox="0 0 16 16" version="1.1" width="16" height="16">
        <path d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0ZM1.5 8a6.5 6.5 0 1 0 13 0 6.5 6.5 0 0 0-13 0Zm7-3.25v2.992l2.028.812a.75.75 0 0 1-.557 1.392l-2.5-1A.75.75 0 0 1 7 8.25v-3.5a.75.75 0 0 1 1.5 0Z" />
      </svg>
    </g>
    <g transform="translate(25, 0)">
      <text x="0" y="0" class="header" data-testid="header"><tspan class="heat-step-1">Wa</tspan><tspan class="heat-step-2">k</tspan><tspan class="heat-step-3">aT</tspan><tspan class="heat-step-4">im</tspan><tspan class="heat-step-5">e</tspan><tspan class="heat-step-6"> S</tspan><tspan class="heat-step-7">ta</tspan><tspan class="heat-step-8">ts</tspan><tspan class="heat-step-9"> (l</tspan><tspan class="heat-step-10">as</tspan><tspan class="heat-step-11">t </tspan><tspan class="heat-step-12">7 </tspan><tspan class="heat-step-13">da</tspan><tspan class="heat-step-14">ys</tspan><tspan class="heat-step-15">)</tspan></text>
    </g>
    <rect data-testid="title-accent" class="title-accent" x="0" y="8" width="296.3" height="2" rx="1" fill="url(#heat-trail)" />
  </g>
  <g data-testid="main-card-body" transform="translate(0, 50)">
    <svg x="0" y="0" width="100%">
      <g data-testid="headline">
        <text data-testid="total" class="headline-total" x="18" y="17"><tspan class="heat-step-1">3</tspan><tspan class="heat-step-2">7</tspan><tspan class="heat-step-3"> </tspan><tspan class="heat-step-4">h</tspan><tspan class="heat-step-5">r</tspan><tspan class="heat-step-6">s</tspan><tspan class="heat-step-7"> </tspan><tspan class="heat-step-8">1</tspan><tspan class="heat-step-9">9</tspan><tspan class="heat-step-10"> </tspan><tspan class="heat-step-11">m</tspan><tspan class="heat-step-12">i</tspan><tspan class="heat-step-13">n</tspan><tspan class="heat-step-15">s</tspan></text>
        <text data-testid="daily-average" class="headline-average" x="183" y="17">5 hrs 19 mins a day</text>
      </g>
      <g transform="translate(0, 36)">
        <mask id="rect-mask">
          <rect x="18" y="0" width="464" height="8" fill="white" rx="4" />
        </mask>
        <rect mask="url(#rect-mask)" data-testid="lang-progress" x="18" y="0" width="185.78560000000002" height="8" fill="#3178c6" />
        <rect mask="url(#rect-mask)" data-testid="lang-progress" x="203.78560000000002" y="0" width="126.7184" height="8" fill="#dea584" />
        <rect mask="url(#rect-mask)" data-testid="lang-progress" x="330.504" y="0" width="71.3168" height="8" fill="#00ADD8" />
        <rect mask="url(#rect-mask)" data-testid="lang-progress" x="401.8208" y="0" width="41.3888" height="8" fill="#3572A5" />
        <rect mask="url(#rect-mask)" data-testid="lang-progress" x="443.2096" y="0" width="23.0608" height="8" fill="#083fa1" />
        <rect mask="url(#rect-mask)" data-testid="lang-progress" x="466.2704" y="0" width="14.0128" height="8" fill="#cb171e" />
        <g transform="translate(18, 25)">
          <circle cx="5" cy="6" r="5" fill="#3178c6" />
          <text data-testid="lang-name" x="15" y="10" class="lang-name">TypeScript - 14 hrs 22 mins</text>
        </g>
        <g transform="translate(230, 25)">
          <circle cx="5" cy="6" r="5" fill="#dea584" />
          <text data-testid="lang-name" x="15" y="10" class="lang-name">Rust - 9 hrs 48 mins</text>
        </g>
        <g transform="translate(18, 50)">
          <circle cx="5" cy="6" r="5" fill="#00ADD8" />
          <text data-testid="lang-name" x="15" y="10" class="lang-name">Go - 5 hrs 31 mins</text>
        </g>
        <g transform="translate(230, 50)">
          <circle cx="5" cy="6" r="5" fill="#3572A5" />
          <text data-testid="lang-name" x="15" y="10" class="lang-name">Python - 3 hrs 12 mins</text>
        </g>
        <g transform="translate(18, 75)">
          <circle cx="5" cy="6" r="5" fill="#083fa1" />
          <text data-testid="lang-name" x="15" y="10" class="lang-name">Markdown - 1 hrs 47 mins</text>
        </g>
        <g transform="translate(230, 75)">
          <circle cx="5" cy="6" r="5" fill="#cb171e" />
          <text data-testid="lang-name" x="15" y="10" class="lang-name">YAML - 1 hrs 5 mins</text>
        </g>
      </g>
    </svg>
  </g>
</svg>
