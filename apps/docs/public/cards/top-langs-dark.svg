<svg width="300" height="336" viewBox="0 0 300 336" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-id desc-id">
  <title id="title-id">Most Used Languages</title>
  <desc id="desc-id">Rust 26.23%, TypeScript 19.29%, Go 17.44%, Python 9.94%, Jupyter Notebook 7.30%, Svelte 4.47%, Other 15.33%</desc>
  <style>
    .header {
      font: 600 18px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif;
      fill: #ff7a1a;
      animation: fadeInAnimation 0.8s ease-in-out backwards;
    }
    /* The icon reads against the title rather than with it, so it keeps its own color. */
    .title-icon {
      fill: #ff7a1a;
      animation: fadeInAnimation 0.8s ease-in-out backwards;
    }
    .title-accent {
      transform-box: fill-box;
      transform-origin: left center;
      animation: trailAnimation 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) 0.2s backwards;
    }
    @supports(-moz-appearance: auto) {
      /* Selector detects Firefox */
      .header {
        font-size: 15.5px;
      }
    }
    @keyframes slideInAnimation {
      from {
        width: 0;
      }
      to {
        width: calc(100%-100px);
      }
    }
    @keyframes growWidthAnimation {
      from {
        width: 0;
      }
      to {
        width: 100%;
      }
    }
    .stat {
      font: 400 14px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif;
      fill: #f7ede6;
    }
    @supports(-moz-appearance: auto) {
      /* Selector detects Firefox */
      .stat {
        font-size: 12px;
      }
    }
    .bold {
      font-weight: 600;
    }
    .lang-name {
      font: 400 11px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif;
      fill: #f7ede6;
    }
    .stagger {
      animation: fadeInAnimation 0.3s ease-in-out backwards;
    }
    #rect-mask rect {
      animation: slideInAnimation 1s ease-in-out backwards;
    }
    .lang-progress {
      animation: growWidthAnimation 0.6s ease-in-out backwards;
    }
    .progress-background {
      fill: #ffffff33;
    }
    .lang-tip {
      animation: fadeInAnimation 0.4s ease-in-out backwards;
    }
    /* Animations */
    @keyframes scaleInAnimation {
      from {
        transform: translate(-5px, 5px) scale(0);
      }
      to {
        transform: translate(-5px, 5px) scale(1);
      }
    }
    @keyframes fadeInAnimation {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
    @keyframes trailAnimation {
      from {
        transform: scaleX(0);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0s !important;
        animation-delay: 0s !important;
      }
    }
  </style>
  <defs>
    <linearGradient id="heat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" class="heat-0" stop-color="#ffd166" />
      <stop offset="0.55" class="heat-1" stop-color="#ff7a1a" />
      <stop offset="1" class="heat-2" stop-color="#ff2e63" />
    </linearGradient>
    <linearGradient id="heat-ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" class="heat-0" stop-color="#ffd166" />
      <stop offset="0.55" class="heat-1" stop-color="#ff7a1a" />
      <stop offset="1" class="heat-2" stop-color="#ff2e63" />
    </linearGradient>
    <linearGradient id="heat-trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" class="heat-0" stop-color="#ffd166" />
      <stop offset="0.3" class="heat-1" stop-color="#ff7a1a" />
      <stop offset="0.7" class="heat-2" stop-color="#ff2e63" stop-opacity="0.5" />
      <stop offset="1" class="heat-2" stop-color="#ff2e63" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="heat-band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" class="band-0" stop-color="#ffd166" stop-opacity="0.08" />
      <stop offset="0.55" class="band-1" stop-color="#ff7a1a" stop-opacity="0.08" />
      <stop offset="1" class="band-2" stop-color="#ff2e63" stop-opacity="0.056" />
    </linearGradient>
    <radialGradient id="heat-glow" cx="0.95" cy="1.05" r="0.8">
      <stop offset="0" class="glow-core" stop-color="#ff7a1a" stop-opacity="0.13" />
      <stop offset="0.45" class="glow-edge" stop-color="#ff2e63" stop-opacity="0.046" />
      <stop offset="1" class="heat-2" stop-color="#ff2e63" stop-opacity="0" />
    </radialGradient>
    <filter id="heat-bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="bloom" />
      <feMerge>
        <feMergeNode in="bloom" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect data-testid="card-bg" class="card-bg" x="0.5" y="0.5" rx="14" height="99%" width="299" stroke="#ff7a1a4d" fill="#16100d" stroke-opacity="1" />
