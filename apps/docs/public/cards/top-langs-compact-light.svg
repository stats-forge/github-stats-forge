      <rect mask="url(#rect-mask)" data-testid="lang-progress" x="192.45" y="0" width="19.28" height="8" fill="#DA5B0B" />
      <rect mask="url(#rect-mask)" data-testid="lang-progress" x="211.73" y="0" width="11.81" height="8" fill="#ff3e00" />
      <rect mask="url(#rect-mask)" data-testid="lang-progress" x="223.54" y="0" width="10.73" height="8" fill="#000080" />
      <rect mask="url(#rect-mask)" data-testid="lang-progress" x="234.26999999999998" y="0" width="10.05" height="8" fill="#6e4a7e" />
      <rect mask="url(#rect-mask)" data-testid="lang-progress" x="244.32" y="0" width="19.69" height="8" fill="#858585" />
      <g transform="translate(0, 25)">
        <g>
          <g>
            <g class="stagger" style="animation-delay: 450ms">
              <circle cx="5" cy="6" r="5" fill="#dea584" />
              <text data-testid="lang-name" x="15" y="10" class="lang-name">Rust 26.23%</text>
            </g>
          </g>
          <g transform="translate(0, 25)">
            <g class="stagger" style="animation-delay: 600ms">
              <circle cx="5" cy="6" r="5" fill="#3178c6" />
              <text data-testid="lang-name" x="15" y="10" class="lang-name">TypeScript 19.29%</text>
            </g>
          </g>
          <g transform="translate(0, 50)">
            <g class="stagger" style="animation-delay: 750ms">
              <circle cx="5" cy="6" r="5" fill="#00ADD8" />
              <text data-testid="lang-name" x="15" y="10" class="lang-name">Go 17.44%</text>
            </g>
          </g>
          <g transform="translate(0, 75)">
            <g class="stagger" style="animation-delay: 900ms">
              <circle cx="5" cy="6" r="5" fill="#3572A5" />
              <text data-testid="lang-name" x="15" y="10" class="lang-name">Python 9.94%</text>
            </g>
          </g>
          <g transform="translate(0, 100)">
            <g class="stagger" style="animation-delay: 1050ms">
              <circle cx="5" cy="6" r="5" fill="#DA5B0B" />
              <text data-testid="lang-name" x="15" y="10" class="lang-name">Jupyter Notebook 7.30%</text>
            </g>
          </g>
        </g>
        <g transform="translate(150, 0)">
          <g>
            <g class="stagger" style="animation-delay: 450ms">
              <circle cx="5" cy="6" r="5" fill="#ff3e00" />
              <text data-testid="lang-name" x="15" y="10" class="lang-name">Svelte 4.47%</text>
            </g>
          </g>
          <g transform="translate(0, 25)">
            <g class="stagger" style="animation-delay: 600ms">
              <circle cx="5" cy="6" r="5" fill="#000080" />
              <text data-testid="lang-name" x="15" y="10" class="lang-name">Lua 4.06%</text>
            </g>
          </g>
          <g transform="translate(0, 50)">
            <g class="stagger" style="animation-delay: 750ms">
              <circle cx="5" cy="6" r="5" fill="#6e4a7e" />
              <text data-testid="lang-name" x="15" y="10" class="lang-name">Elixir 3.81%</text>
            </g>
          </g>
          <g transform="translate(0, 75)">
            <g class="stagger" style="animation-delay: 900ms">
              <circle cx="5" cy="6" r="5" fill="#858585" />
              <text data-testid="lang-name" x="15" y="10" class="lang-name">Other 7.46%</text>
            </g>
