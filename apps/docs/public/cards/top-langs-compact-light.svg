<svg width="300" height="199" viewBox="0 0 300 199" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-id desc-id">
  <title id="title-id">Most Used Languages</title>
  <desc id="desc-id">Rust 26.23%, TypeScript 19.29%, Go 17.44%, Python 9.94%, Jupyter Notebook 7.30%, Svelte 4.47%, Lua 4.06%, Elixir 3.81%, Other 7.46%</desc>
  <style>
    .header {
      font: 600 18px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif;
      fill: url(#heat);
      animation: fadeInAnimation 0.8s ease-in-out backwards;
    }
    /* The icon reads against the title rather than with it, so it keeps its own color. */
    .title-icon {
      fill: #e2470f;
      animation: fadeInAnimation 0.8s ease-in-out backwards;
    }
    .title-accent {
      transform-box: fill-box;
      transform-origin: left center;
      animation: trailAnimation 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) 0.2s backwards;
    }
    @supports(-moz-appearance: auto) {
      /* Selector detects Firefox */
      .header {
        font-size: 15.5px;
      }
    }
    @keyframes slideInAnimation {
      from {
        width: 0;
      }
      to {
        width: calc(100%-100px);
      }
    }
    @keyframes growWidthAnimation {
      from {
        width: 0;
      }
      to {
        width: 100%;
      }
    }
    .stat {
      font: 400 14px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif;
      fill: #2a1b14;
    }
    @supports(-moz-appearance: auto) {
      /* Selector detects Firefox */
      .stat {
        font-size: 12px;
      }
    }
    .bold {
      font-weight: 600;
    }
    .lang-name {
      font: 400 11px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif;
      fill: #2a1b14;
    }
    .stagger {
      animation: fadeInAnimation 0.3s ease-in-out backwards;
    }
    #rect-mask rect {
      animation: slideInAnimation 1s ease-in-out backwards;
    }
    .lang-progress {
      animation: growWidthAnimation 0.6s ease-in-out backwards;
    }
    .progress-background {
      fill: #ddd;
    }
    .lang-tip {
      animation: fadeInAnimation 0.4s ease-in-out backwards;
    }
    /* Animations */
    @keyframes scaleInAnimation {
      from {
        transform: translate(-5px, 5px) scale(0);
      }
      to {
        transform: translate(-5px, 5px) scale(1);
      }
    }
    @keyframes fadeInAnimation {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
    @keyframes trailAnimation {
      from {
        transform: scaleX(0);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0s !important;
        animation-delay: 0s !important;
      }
    }
  </style>
  <defs>
    <linearGradient id="heat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" class="heat-0" stop-color="#dc7600" />
      <stop offset="0.55" class="heat-1" stop-color="#e2470f" />
      <stop offset="1" class="heat-2" stop-color="#c8174f" />
    </linearGradient>
    <linearGradient id="heat-trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" class="heat-0" stop-color="#dc7600" />
      <stop offset="0.3" class="heat-1" stop-color="#e2470f" />
      <stop offset="0.7" class="heat-2" stop-color="#c8174f" stop-opacity="0.5" />
      <stop offset="1" class="heat-2" stop-color="#c8174f" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="heat-band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" class="band-0" stop-color="#dc7600" stop-opacity="0.1" />
      <stop offset="0.55" class="band-1" stop-color="#e2470f" stop-opacity="0.1" />
      <stop offset="1" class="band-2" stop-color="#c8174f" stop-opacity="0.07" />
    </linearGradient>
    <radialGradient id="heat-glow" cx="0.95" cy="1.05" r="0.8">
      <stop offset="0" class="glow-core" stop-color="#e2470f" stop-opacity="0.17" />
      <stop offset="0.45" class="glow-edge" stop-color="#c8174f" stop-opacity="0.06" />
      <stop offset="1" class="heat-2" stop-color="#c8174f" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect data-testid="card-bg" class="card-bg" x="0.5" y="0.5" rx="14" height="99%" width="299" stroke="#e2470f4d" fill="#fffaf6" stroke-opacity="1" />
  <rect data-testid="card-glow" x="0.5" y="0.5" rx="14" height="99%" width="299" fill="url(#heat-glow)" />
  <path data-testid="title-band" d="M0.5 14.5a14 14 0 0 1 14 -14h271a14 14 0 0 1 14 14v26.5h-299z" fill="url(#heat-band)" />
  <g data-testid="card-title" transform="translate(18, 25)">
    <g>
      <svg class="title-icon" x="0" y="-13" viewBox="0 0 16 16" version="1.1" width="16" height="16">
        <path d="M4.72 3.22a.75.75 0 0 1 1.06 1.06L2.06 8l3.72 3.72a.75.75 0 1 1-1.06 1.06L.47 8.53a.75.75 0 0 1 0-1.06Zm6.56 0a.75.75 0 1 0-1.06 1.06L13.94 8l-3.72 3.72a.75.75 0 1 0 1.06 1.06l4.25-4.25a.75.75 0 0 0 0-1.06Z" />
      </svg>
    </g>
    <g transform="translate(25, 0)">
      <text x="0" y="0" class="header" data-testid="header">Most Used Languages</text>
    </g>
    <rect data-testid="title-accent" class="title-accent" x="0" y="8" width="242.3" height="2" rx="1" fill="url(#heat-trail)" />
  </g>
  <g data-testid="main-card-body" transform="translate(0, 50)">
    <svg data-testid="lang-items" x="18">
      <mask id="rect-mask">
        <rect x="0" y="0" width="264" height="8" fill="white" rx="5" />
      </mask>
      <rect mask="url(#rect-mask)" data-testid="lang-progress" x="0" y="0" width="69.25" height="8" fill="#dea584" />
      <rect mask="url(#rect-mask)" data-testid="lang-progress" x="69.25" y="0" width="50.92" height="8" fill="#3178c6" />
      <rect mask="url(#rect-mask)" data-testid="lang-progress" x="120.17" y="0" width="46.03" height="8" fill="#00ADD8" />
