              <text data-testid="lang-name" x="15" y="10" class="lang-name">Rust 0.21%</text>
            </g>
          </g>
          <g transform="translate(0, 50)">
            <g class="stagger" style="animation-delay: 750ms">
              <circle cx="5" cy="6" r="5" fill="#663399" />
              <text data-testid="lang-name" x="15" y="10" class="lang-name">CSS 0.11%</text>
