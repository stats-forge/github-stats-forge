              <circle cx="5" cy="6" r="5" fill="#3178c6" />
              <text data-testid="lang-name" x="15" y="10" class="lang-name">TypeScript 93.55%</text>
            </g>
          </g>
          <g transform="translate(0, 25)">
            <g class="stagger" style="animation-delay: 600ms">
              <circle cx="5" cy="6" r="5" fill="#f1e05a" />
              <text data-testid="lang-name" x="15" y="10" class="lang-name">JavaScript 4.96%</text>
            </g>
          </g>
          <g transform="translate(0, 50)">
            <g class="stagger" style="animation-delay: 750ms">
              <circle cx="5" cy="6" r="5" fill="#ff3e00" />
              <text data-testid="lang-name" x="15" y="10" class="lang-name">Svelte 0.70%</text>
            </g>
          </g>
          <g transform="translate(0, 75)">
            <g class="stagger" style="animation-delay: 900ms">
              <circle cx="5" cy="6" r="5" fill="#c6538c" />
              <text data-testid="lang-name" x="15" y="10" class="lang-name">SCSS 0.26%</text>
            </g>
          </g>
        </g>
        <g transform="translate(150, 0)">
