<svg width="300" height="325" viewBox="0 0 300 325" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="titleId descId">
  <title id="titleId">Most Used Languages</title>
  <desc id="descId">TypeScript 93.66%, JavaScript 4.97%, Svelte 0.70%, SCSS 0.26%, HTML 0.21%, Rust 0.21%</desc>
  <style>
    .header {
      font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #2f80ed;
      animation: fadeInAnimation 0.8s ease-in-out forwards;
    }
    @supports(-moz-appearance: auto) {
      /* Selector detects Firefox */
      .header {
        font-size: 15.5px;
      }
    }
    @keyframes slideInAnimation {
      from {
        width: 0;
      }
      to {
        width: calc(100%-100px);
      }
    }
    @keyframes growWidthAnimation {
      from {
        width: 0;
      }
      to {
        width: 100%;
      }
    }
    .stat {
      font: 600 14px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif;
      fill: #434d58;
    }
    @supports(-moz-appearance: auto) {
      /* Selector detects Firefox */
      .stat {
        font-size: 12px;
      }
    }
    .bold {
      font-weight: 700;
    }
    .lang-name {
      font: 400 11px "Segoe UI", Ubuntu, Sans-Serif;
      fill: #434d58;
    }
    .stagger {
      opacity: 0;
      animation: fadeInAnimation 0.3s ease-in-out forwards;
    }
    #rect-mask rect {
      animation: slideInAnimation 1s ease-in-out forwards;
    }
    .lang-progress {
      animation: growWidthAnimation 0.6s ease-in-out forwards;
    }
    .progress-background {
      fill: #ddd;
    }
    /* Animations */
    @keyframes scaleInAnimation {
      from {
        transform: translate(-5px, 5px) scale(0);
      }
      to {
        transform: translate(-5px, 5px) scale(1);
      }
    }
    @keyframes fadeInAnimation {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0s !important;
        animation-delay: 0s !important;
      }
    }
  </style>
  <rect data-testid="card-bg" class="card-bg" x="0.5" y="0.5" rx="8" height="99%" stroke="#0000001f" width="299" fill="#fffefe" stroke-opacity="1" />
  <g data-testid="card-title" transform="translate(25, 35)">
    <text x="0" y="0" class="header" data-testid="header">Most Used Languages</text>
  </g>
  <g data-testid="main-card-body" transform="translate(0, 55)">
    <svg data-testid="lang-items" x="25">
      <g>
        <g class="stagger" style="animation-delay: 450ms">
          <text data-testid="lang-name" x="2" y="15" class="lang-name">TypeScript</text>
          <text x="215" y="34" class="lang-name">93.66%</text>
          <svg width="205" x="0" y="25">
            <rect data-testid="progress-background" class="progress-background" rx="5" ry="5" x="0" y="0" width="205" height="8" />
            <svg data-testid="lang-progress" width="93.65544386776628%">
              <rect height="8" fill="#3178c6" rx="5" ry="5" x="0" y="0" class="lang-progress" style="animation-delay: 750ms;" />
            </svg>
          </svg>
        </g>
      </g>
      <g transform="translate(0, 40)">
        <g class="stagger" style="animation-delay: 600ms">
          <text data-testid="lang-name" x="2" y="15" class="lang-name">JavaScript</text>
          <text x="215" y="34" class="lang-name">4.97%</text>
          <svg width="205" x="0" y="25">
            <rect data-testid="progress-background" class="progress-background" rx="5" ry="5" x="0" y="0" width="205" height="8" />
            <svg data-testid="lang-progress" width="4.96504349604508%">
              <rect height="8" fill="#f1e05a" rx="5" ry="5" x="0" y="0" class="lang-progress" style="animation-delay: 900ms;" />
            </svg>
          </svg>
        </g>
      </g>
      <g transform="translate(0, 80)">
        <g class="stagger" style="animation-delay: 750ms">
          <text data-testid="lang-name" x="2" y="15" class="lang-name">Svelte</text>
          <text x="215" y="34" class="lang-name">0.70%</text>
          <svg width="205" x="0" y="25">
            <rect data-testid="progress-background" class="progress-background" rx="5" ry="5" x="0" y="0" width="205" height="8" />
            <svg data-testid="lang-progress" width="2%">
              <rect height="8" fill="#ff3e00" rx="5" ry="5" x="0" y="0" class="lang-progress" style="animation-delay: 1050ms;" />
            </svg>
          </svg>
        </g>
      </g>
      <g transform="translate(0, 120)">
        <g class="stagger" style="animation-delay: 900ms">
          <text data-testid="lang-name" x="2" y="15" class="lang-name">SCSS</text>
          <text x="215" y="34" class="lang-name">0.26%</text>
          <svg width="205" x="0" y="25">
            <rect data-testid="progress-background" class="progress-background" rx="5" ry="5" x="0" y="0" width="205" height="8" />
            <svg data-testid="lang-progress" width="2%">
              <rect height="8" fill="#c6538c" rx="5" ry="5" x="0" y="0" class="lang-progress" style="animation-delay: 1200ms;" />
            </svg>
          </svg>
        </g>
      </g>
      <g transform="translate(0, 160)">
        <g class="stagger" style="animation-delay: 1050ms">
          <text data-testid="lang-name" x="2" y="15" class="lang-name">HTML</text>
          <text x="215" y="34" class="lang-name">0.21%</text>
          <svg width="205" x="0" y="25">
            <rect data-testid="progress-background" class="progress-background" rx="5" ry="5" x="0" y="0" width="205" height="8" />
            <svg data-testid="lang-progress" width="2%">
              <rect height="8" fill="#e34c26" rx="5" ry="5" x="0" y="0" class="lang-progress" style="animation-delay: 1350ms;" />
            </svg>
          </svg>
        </g>
      </g>
      <g transform="translate(0, 200)">
        <g class="stagger" style="animation-delay: 1200ms">
          <text data-testid="lang-name" x="2" y="15" class="lang-name">Rust</text>
          <text x="215" y="34" class="lang-name">0.21%</text>
          <svg width="205" x="0" y="25">
            <rect data-testid="progress-background" class="progress-background" rx="5" ry="5" x="0" y="0" width="205" height="8" />
            <svg data-testid="lang-progress" width="2%">
              <rect height="8" fill="#dea584" rx="5" ry="5" x="0" y="0" class="lang-progress" style="animation-delay: 1500ms;" />
            </svg>
          </svg>
        </g>
      </g>
    </svg>
  </g>
</svg>
