# Hooks are installed by `prepare`, which pnpm runs after every install.
pre-commit:
  # `lint` and `test` read what `format` rewrote, so the order matters.
  piped: true
  jobs:
    - name: format
      glob: '*.{js,jsx,ts,tsx,json,jsonc,yaml,yml,md,graphql}'
      # a commit staging only files oxfmt ignores, such as the lockfile, has nothing to format
      run: pnpm exec oxfmt --write --no-error-on-unmatched-pattern {staged_files}
      # a file the formatter rewrote goes into the same commit, rather than being left dirty
      stage_fixed: true

    - name: lint
      run: pnpm run lint

    - name: test
      run: pnpm test
