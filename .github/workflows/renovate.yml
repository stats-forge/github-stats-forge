name: Renovate

# Self-hosted rather than the Mend app, for one reason: `postUpgradeTasks` is a self-hosted-only
# option, and it is what writes the changeset a documentation pin needs. The configuration is
# `.github/renovate.json5`; this workflow only decides when Renovate gets to look.
on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: The log level to run with.
        required: false
        default: info
        type: choice
        options: [info, debug]
      dryRun:
        description: Resolve and log the updates without opening anything.
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - .github/renovate.json5
  schedule:
    #        ┌───────────── minute (0 - 59)
    #        │  ┌───────────── hour (0 - 23)
    #        │  │ ┌───────────── day of the month (1 - 31)
    #        │  │ │ ┌───────────── month (1 - 12 or JAN-DEC)
    #        │  │ │ │ ┌───────────── day of the week (0 - 6 or SUN-SAT)
    #        *  * * * *
    # Daily: the per-manager `schedule` in the configuration narrows it from here — npm to
    # Wednesday and Saturday, the base image to Monday, the documentation pins to every run.
    - cron: '45 0 * * *'

# A dispatch racing the schedule would resolve the same updates twice.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  renovate:
    if: github.repository == 'stats-forge/github-stats-forge'
    name: Renovate
    runs-on: ubuntu-latest

    timeout-minutes: 30

    environment: update-meta-files # where HELPER_APP_ID and HELPER_PRIVATE_KEY live

    permissions:
      contents: read # the app token, not GITHUB_TOKEN, pushes the branches and opens the PRs

    steps:
      # A GitHub App token, not GITHUB_TOKEN: events from the default token do not
      # start other workflows, so CI would never run on the generated PRs.
      - name: Setup release helper
        id: release-helper
        uses: marcalexiei/github-actions/setup-github-app-user-bot@e9655755a6dc0040e650a931ee5d958c7d7a9f22 # v2.3.1
        with:
          app-id: ${{ vars.HELPER_APP_ID }}
          private-key: ${{ secrets.HELPER_PRIVATE_KEY }}

      # No checkout: Renovate clones the repository itself, and reads the configuration from it.
      - name: Renovate
        uses: renovatebot/github-action@dcfba84a42d1b5d5e49bf131b1bf53511851a123 # v46.3.1
        with:
          token: ${{ steps.release-helper.outputs.token }}
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun == true && 'full' || '' }}
          RENOVATE_GIT_AUTHOR: '${{ steps.release-helper.outputs.bot-name }} <${{ steps.release-helper.outputs.bot-email }}>'
          # Reads changelogs and resolves release tags on repositories other than this one.
          GITHUB_COM_TOKEN: ${{ github.token }}
          # `postUpgradeTasks` runs nothing that is not listed here.
          RENOVATE_ALLOWED_COMMANDS: '["^\\.github/scripts/renovate-changeset\\.sh "]'
