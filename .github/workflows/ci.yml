# EXPERIMENT, never to be merged: four ways of getting a browser into the docs job, three
# samples of each. The real workflow is restored before anything is proposed.
name: CI

on:
  workflow_dispatch:

# Its own group, so a dispatch here cannot queue behind or ahead of a run on main.
concurrency:
  group: playwright-experiment
  cancel-in-progress: false

permissions: {}

jobs:
  runner:
    name: ${{ matrix.variant.name }} #${{ matrix.sample }}

    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
        variant:
          - { name: baseline, args: '--with-deps chromium' }
          - { name: shell-with-deps, args: '--with-deps --only-shell chromium' }
          - { name: shell-no-deps, args: '--only-shell chromium' }
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Dependencies
        uses: marcalexiei/github-actions/setup-node-and-pnpm@e9655755a6dc0040e650a931ee5d958c7d7a9f22 # v2.3.1

      - name: Lint (generated theme page)
        run: pnpm --filter ./apps/docs run check-themes-page

      - name: Lint (anvil samples)
        run: pnpm --filter ./apps/docs run check-anvil-samples

      - name: Typecheck
        run: pnpm --filter ./apps/docs run typecheck

      - name: Build
        run: pnpm run docs:build

      - name: Install Playwright browser
        run: pnpm --filter ./apps/docs exec playwright install ${{ matrix.variant.args }}

      - name: Test (anvil, end to end)
        run: pnpm --filter ./apps/docs run test:e2e

  image:
    name: image #${{ matrix.sample }}

    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
    runs-on: ubuntu-latest

    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The shared setup action reads `packageManager` with jq, which the image does not ship.
      - name: Install jq
        run: |
          curl -fsSL -o /usr/local/bin/jq https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64
          chmod +x /usr/local/bin/jq

      - name: Install Dependencies
        uses: marcalexiei/github-actions/setup-node-and-pnpm@e9655755a6dc0040e650a931ee5d958c7d7a9f22 # v2.3.1

      - name: Lint (generated theme page)
        run: pnpm --filter ./apps/docs run check-themes-page

      - name: Lint (anvil samples)
        run: pnpm --filter ./apps/docs run check-anvil-samples

      - name: Typecheck
        run: pnpm --filter ./apps/docs run typecheck

      - name: Build
        run: pnpm run docs:build

      - name: Test (anvil, end to end)
        run: pnpm --filter ./apps/docs run test:e2e
