name: GitHub Actions Audit

on:
  push:
    branches:
      - main
    paths:
      - .github/**/*
  pull_request:
    paths:
      - .github/**/*

permissions: {}

concurrency:
  group: '${{ github.workflow }}-${{ github.head_ref || github.ref }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read # required to check out the repository
      actions: read # required by zizmor to read workflow runs

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false

  jactionlint:
    name: jactionlint
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read # required to check out the repository

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run jactionlint
        uses: jdx/jactionlint@1027f0a131ab98bc7e191d995bfa15dbed5bbf8f # v2.2.0
        with:
          online: false # keeps the token out of the downloaded binary's environment
