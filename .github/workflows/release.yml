name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  # queue every push: without it, a newer run replaces the waiting one and that release is skipped
  queue: max

permissions: {}

defaults:
  run:
    shell: bash

# Skips the pre-commit hook — see ../CONTRIBUTING.md, "Workflows That Commit".
env:
  LEFTHOOK: 0

jobs:
  release:
    name: Release

    environment: release-npm

    runs-on: ubuntu-26.04
    timeout-minutes: 10

    permissions:
      contents: write # required to push release commits and tags
      pull-requests: write # required to create and update release PRs
      id-token: write # required for npm OIDC trusted publishing

    outputs:
      published: ${{ steps.changesets.outputs.published }}
      # `[]` when the action sets no list, so the image job's `fromJSON` still parses.
      publishedPackages: ${{ steps.changesets.outputs['published-packages'] || '[]' }}

    steps:
      # A GitHub App token, not GITHUB_TOKEN: events from the default token do not
      # start other workflows, so CI would never run on the release PR.
      - name: Setup release helper
        id: release-helper
        uses: marcalexiei/github-actions/setup-github-app-user-bot@92c64c084d3479cff756151cb8163d03608f2acd # v2.4.2
        with:
          app-id: ${{ vars.RELEASE_HELPER_APP_ID }}
          private-key: ${{ secrets.RELEASE_HELPER_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Dependencies
        uses: marcalexiei/github-actions/setup-node-and-pnpm@92c64c084d3479cff756151cb8163d03608f2acd # v2.4.2
        with:
          save-cache: false

      # `pnpm release` builds, then `changeset publish` publishes every package whose
      # version is not yet on npm, in dependency order.
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ steps.release-helper.outputs.token }}
          commit-message: 'chore: release'
          pr-title: 'chore: release'
          pr-base-branch: main
          publish-script: 'pnpm release'

  # One release, three channels: npm above, the image here, the site below.
  image:
    name: Image
    needs: release
    # The server is tagged like any other package, so its own entry is the gate.
    if: ${{ contains(fromJSON(needs.release.outputs.publishedPackages).*.name, '@stats-forge/github-stats-server') }}
    uses: $/.github/workflows/publish-image.yml
    permissions:
      contents: read # to check out the repository
      packages: write # to push the image to GHCR
    with:
      ref: ${{ github.sha }}

  # Changesets writes the changelog and nothing else, so nothing on the release says which image
  # it is. Runs after the push, so the reference it adds is one that already resolves.
  annotate:
    name: Annotate
    needs: [release, image]
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    permissions:
      contents: write # required to edit the release body

    steps:
      - name: Name the image on the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PACKAGES: ${{ needs.release.outputs.publishedPackages }}
          IMAGE: ghcr.io/${{ github.repository }}-server
          PACKAGE: '@stats-forge/github-stats-server'
        run: |
          version=$(jq -r --arg n "$PACKAGE" '.[] | select(.name == $n) | .version' <<< "$PACKAGES")
          if [ -z "$version" ]; then
            echo "No entry for $PACKAGE; nothing to annotate."
            exit 0
          fi

          tag="$PACKAGE@$version"
          reference="$IMAGE:$version"
          body=$(gh release view "$tag" --json body --jq '.body')

          # Re-running the release must not append it twice.
          if [ "${body#*"$reference"}" != "$body" ]; then
            echo "$tag already names $reference."
            exit 0
          fi

          # The bare reference in a fenced block: it pastes into a compose `image:` as readily as
          # into a `docker run`, and GitHub puts a copy button on a block but not on inline code.
          cat > notes.md <<EOF
          $body

          ---

          This release ships as a container image:

          \`\`\`
          $reference
          \`\`\`
          EOF
          gh release edit "$tag" --notes-file notes.md

  # The site documents every released package, the server included, so it goes out with a release.
  docs:
    name: Docs
    needs: release
    if: ${{ needs.release.outputs.published == 'true' }}
    uses: $/.github/workflows/deploy-docs.yml
    permissions:
      contents: read # to check out repo (actions/checkout)
      pages: write # to publish to GitHub Pages (actions/deploy-pages)
      id-token: write # to verify the deployment originates from this workflow
    with:
      ref: ${{ github.sha }}

  # Its own job, so a comment that fails is a red job to re-run rather than an error swallowed
  # inside a green release: the packages are already on npm by the time it runs.
  comment:
    name: Comment
    needs: release
    if: ${{ needs.release.outputs.published == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    environment: release-npm # where the release helper's credentials live

    permissions:
      contents: read # required to check out the repository

    steps:
      # The app's token, not the default one: it carries issues:write, and the comments
      # then come from the same bot that opened the release PR.
      - name: Setup release helper
        id: release-helper
        uses: marcalexiei/github-actions/setup-github-app-user-bot@92c64c084d3479cff756151cb8163d03608f2acd # v2.4.2
        with:
          app-id: ${{ vars.RELEASE_HELPER_APP_ID }}
          private-key: ${{ secrets.RELEASE_HELPER_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the commenter reads the history before the release commit

      - name: Comment on shipped PRs and issues
        uses: marcalexiei/changesets-release-commenter@97096fbe9cde74fcae784df963274998e0090a7c # v0.3.1
        with:
          github-token: ${{ steps.release-helper.outputs.token }}
          published-packages: ${{ needs.release.outputs.publishedPackages }}
