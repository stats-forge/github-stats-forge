version: 2
updates:
  # Maintain dependencies for npm
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: cron
      cronjob: '45 0 * * 3,6'
    open-pull-requests-limit: 20
    commit-message:
      prefix: 'build(deps)'
      prefix-development: 'build(deps-dev)'
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
      eslint:
        patterns:
          - 'eslint'
          - '@eslint/*'
          - 'eslint-*'
          - 'typescript-eslint'
      typescript:
        patterns:
          - 'typescript'
          - '@types/*'
      graphql:
        patterns:
          - 'graphql'
          - '@graphql-codegen/*'
          - '@octokit/graphql-schema'
      testing-library:
        patterns:
          - '@testing-library/*'
      # the config declares a peer range on oxfmt, so a lone bump can break it
      oxfmt:
        patterns:
          - 'oxfmt'
          - '@marcalexiei/oxfmt-config'

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: daily
    open-pull-requests-limit: 20
    commit-message:
      prefix: 'ci(deps)'
    cooldown:
      default-days: 7
