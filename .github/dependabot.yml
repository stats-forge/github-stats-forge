version: 2
updates:
  # Maintain dependencies for npm
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: cron
      cronjob: '45 0 * * 3,6'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'build(deps)'
      prefix-development: 'build(deps-dev)'
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
      typescript:
        patterns:
          - 'typescript'
          - '@types/*'
      graphql:
        patterns:
          - 'graphql'
          - '@graphql-codegen/*'
          - '@octokit/graphql-schema'
      testing-library:
        patterns:
          - '@testing-library/*'
      # the config declares a peer range on oxfmt, so a lone bump can break it
      oxfmt:
        patterns:
          - 'oxfmt'
          - '@marcalexiei/oxfmt-config'
      # same for oxlint, whose config also pins `oxlint-tsgolint`
      oxlint:
        patterns:
          - 'oxlint'
          - 'oxlint-tsgolint'
          - '@marcalexiei/oxlint-config'

  # The server's base image digest: `node:24-alpine` is a moving tag, so a bump arrives as a PR CI has run.
  - package-ecosystem: docker
    directory: '/apps/server'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'build(deps)'
    cooldown:
      default-days: 7
    ignore:
      # the server's own `engines` and `@types/node` decide which major it runs on
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci(deps)'
    cooldown:
      default-days: 7
    groups:
      # the upload and the deploy halves of a Pages run are released as a pair
      pages:
        patterns:
          - 'actions/configure-pages'
          - 'actions/upload-pages-artifact'
          - 'actions/deploy-pages'
