fragment RepoNode on Repository {
  name
  stargazerCount
}

fragment RepoStars on User {
  repositories(
    first: 100
    after: $after
    ownerAffiliations: $ownerAffiliations
    orderBy: { direction: DESC, field: STARGAZERS }
  ) {
    totalCount
    nodes {
      ...RepoNode
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

query userRepos($login: String!, $after: String, $ownerAffiliations: [RepositoryAffiliation]) {
  user(login: $login) {
    ...RepoStars
  }
}

query userInfo(
  $login: String!
  $after: String
  $includeMergedPullRequests: Boolean!
  $includeDiscussions: Boolean!
  $includeDiscussionsAnswers: Boolean!
  $startTime: DateTime = null
  $endTime: DateTime = null
  $ownerAffiliations: [RepositoryAffiliation]
  $includeUserRepositories: Boolean!
) {
  user(login: $login) {
    name
    login
    commits: contributionsCollection(from: $startTime, to: $endTime) {
      totalCommitContributions
    }
    reviews: contributionsCollection {
      totalPullRequestReviewContributions
    }
    repositoriesContributedTo(
      first: 1
      contributionTypes: [COMMIT, ISSUE, PULL_REQUEST, REPOSITORY]
      includeUserRepositories: $includeUserRepositories
    ) {
      totalCount
    }
    pullRequests(first: 1) {
      totalCount
    }
    mergedPullRequests: pullRequests(states: MERGED) @include(if: $includeMergedPullRequests) {
      totalCount
    }
    openIssues: issues(states: OPEN) {
      totalCount
    }
    closedIssues: issues(states: CLOSED) {
      totalCount
    }
    followers {
      totalCount
    }
    repositoryDiscussions @include(if: $includeDiscussions) {
      totalCount
    }
    repositoryDiscussionComments(onlyAnswers: true) @include(if: $includeDiscussionsAnswers) {
      totalCount
    }
    contributionsCollection {
      contributionYears
    }
    ...RepoStars
  }
}

fragment RangeContributions on ContributionsCollection {
  totalCommitContributions
  contributionCalendar {
    totalContributions
  }
}

# `contributions` takes no slicing argument on purpose: `totalCount` alone costs no nodes.
fragment RangeContributionsByRepo on ContributionsCollection {
  commitContributionsByRepository(maxRepositories: $maxRepositories) {
    repository {
      nameWithOwner
    }
    contributions {
      totalCount
    }
  }
  issueContributionsByRepository(maxRepositories: $maxRepositories) {
    repository {
      nameWithOwner
    }
    contributions {
      totalCount
    }
  }
  pullRequestContributionsByRepository(maxRepositories: $maxRepositories) {
    repository {
      nameWithOwner
    }
    contributions {
      totalCount
    }
  }
  repositoryContributions(first: $maxRepositories) @include(if: $includeOwnRepos) {
    nodes {
      repository {
        nameWithOwner
      }
    }
  }
}
