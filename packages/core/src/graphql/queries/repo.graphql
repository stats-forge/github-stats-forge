fragment RepoInfo on Repository {
  name
  nameWithOwner
  isPrivate
  isArchived
  isTemplate
  stargazerCount
  description
  primaryLanguage {
    color
    id
    name
  }
  forkCount
  repositoryTopics(first: 20) @include(if: $includeTopics) {
    nodes {
      topic {
        name
      }
    }
  }
}

query getRepo($login: String!, $repo: String!, $includeTopics: Boolean!) {
  user(login: $login) {
    repository(name: $repo) {
      ...RepoInfo
    }
  }
  organization(login: $login) {
    repository(name: $repo) {
      ...RepoInfo
    }
  }
}
