fragment TopLanguage on LanguageEdge {
  size
  node {
    color
    name
  }
}

fragment TopLanguagesRepository on Repository {
  name
  nameWithOwner
  languages(first: 10, orderBy: { field: SIZE, direction: DESC }) {
    edges {
      ...TopLanguage
    }
  }
}

query topLanguages($login: String!, $ownerAffiliations: [RepositoryAffiliation], $after: String) {
  user(login: $login) {
    # no forks; the most recently pushed first, so the card counts current work
    repositories(
      ownerAffiliations: $ownerAffiliations
      isFork: false
      first: 100
      after: $after
      orderBy: { field: PUSHED_AT, direction: DESC }
    ) {
      pageInfo {
        hasNextPage
        endCursor
      }
      nodes {
        ...TopLanguagesRepository
      }
    }
  }
}
